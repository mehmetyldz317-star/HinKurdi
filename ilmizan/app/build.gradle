plugins { id 'com.android.application' }
android {
    namespace 'com.ilmizan.kitapligim'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ilmizan.kitapligim.yeni'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '1.3.2'
    }
    signingConfigs {
        ilmizanStable {
            storeFile file(System.getenv('HOME') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.ilmizanStable
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
