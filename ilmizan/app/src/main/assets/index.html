.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{flex:1}.fieldlabel{font-size:12px;font-weight:730;letter-spacing:.25px;color:var(--emerald);display:block;margin:15px 0 7px}.field{width:100%;border:1px solid #d6e0d5;background:white;border-radius:12px;color:var(--ink);padding:13px 14px;font-size:15px}.fieldtitle{font:600 21px Georgia,serif}.bodyarea{display:block;width:100%;min-height:55dvh;border:1px solid #d5ded3;background:#fff;border-radius:14px;color:#1b302a;padding:17px 15px;line-height:1.7;font-size:16px;resize:vertical;white-space:pre-wrap}.edithelp{font-size:12px;color:var(--muted);margin-top:8px}.savedot{font-size:12px;color:#b6d3bd;display:inline-block;margin:0 0 0 10px}.fixedbar{position:fixed;bottom:0;left:0;right:0;background:rgba(248,246,240,.97);border-top:1px solid #e0e8dc;padding:11px max(16px, env(safe-area-inset-right)) calc(11px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));z-index:5}.fixedinner{max-width:770px;margin:auto;display:flex;gap:10px}.fixedinner>*{flex:1}

.modalOverlay{position:fixed;inset:0;background:rgba(11,33,27,.53);display:flex;align-items:center;justify-content:center;padding:19px;z-index:20}.modal{width:100%;max-width:420px;background:var(--paper);border-radius:22px;padding:24px 20px;box-shadow:0 17px 50px #0004}.modal h3{font:600 23px Georgia,serif;margin:0 0 8px}.modal p{font-size:13px;line-height:1.6;color:var(--muted);margin:0 0 16px}.modalactions{display:flex;gap:10px;margin-top:17px}.modalactions>*{flex:1}.toast{position:fixed;left:50%;bottom:91px;transform:translateX(-50%);background:#204d3d;color:white;padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:0 4px 20px #0002;z-index:30;max-width:92%;text-align:center}.hidden{display:none!important}.eyebrow{text-transform:uppercase;font-size:11px;font-weight:750;letter-spacing:1.1px;color:var(--gold);margin-top:3px}.footnote{text-align:center;color:#95a39a;font-size:11px;margin:26px auto 3px;letter-spacing:1.5px}.divider{height:1px;background:var(--line);margin:13px 0}.inlinehead{display:flex;gap:8px;align-items:center;justify-content:space-between}

.resume{background:#e9f1e9;border:1px solid #cfdcce;border-radius:14px;padding:13px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;justify-content:space-between}.resume b{display:block;color:#1c493a;font:600 16px Georgia,serif}.resume small{display:block;font-size:12px;color:#547764;margin-top:5px}.resume button{white-space:nowrap}</style></head><body><div id="app"></div><div id="modal-root"></div><div id="toast" class="toast hidden"></div>
<script>
(function(){'use strict';
const KEY='ilmizan_kitapligim_v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY));if(!db||!Array.isArray(db.books))throw 0}catch(e){db={books:[],fontSize:18}}
let view={page:'home',bookId:null,chapterId:null};let pagination={page:1,count:1,width:0};let resizeTimer=null;let gestureStart=null;let editTimer=null;let pending=false;let savedAt=Date.now();let searchText='';
const $=id=>document.getElementById(id), safe=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString();
const words=s=>((s||'').trim().match(/\S+/g)||[]).length;
const book=()=>db.books.find(x=>x.id===view.bookId); const chap=()=>{const b=book();return b?b.chapters.find(c=>c.id===view.chapterId):null};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));savedAt=Date.now();return true}catch(e){toast('Kayıt yapılamadı. Telefon depolama alanını kontrol edin.');return false}}
function flush(){if(editTimer){clearTimeout(editTimer);editTimer=null}if(view.page==='editor'&&pending)saveEditor(false)}
function date(s){try{return new Date(s).toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),2700)}
function header(title,subtitle,back,menu){return '<header class="head"><div class="top"><span class="brand">İLMİZAN · KİTAP ARŞİVİ</span><span>'+ (back?'<button class="headback" data-action="back">‹ Geri</button>':'<button class="headbtn" data-action="backup" aria-label="Yedekleme">⋯</button>')+'</span></div><h1>'+safe(title)+'</h1><p>'+safe(subtitle||'')+'</p></header>'}
function foot(){return '<div class="footnote">İLMİZAN · KİTAPLIĞIM</div>'}
function empty(icon,title,desc,button,action){return '<div class="empty"><span class="symbol">'+icon+'</span><b>'+safe(title)+'</b><p>'+safe(desc)+'</p><button class="primary" data-action="'+action+'">'+safe(button)+'</button></div>'}
function home(){const bc=db.books.length, cc=db.books.reduce((s,b)=>s+b.chapters.length,0);const q=searchText.trim().toLocaleLowerCase('tr-TR');let filtered=db.books.filter(b=>!q||b.title.toLocaleLowerCase('tr-TR').includes(q)||b.chapters.some(c=>(c.title+' '+c.body).toLocaleLowerCase('tr-TR').includes(q)));
const cards=filtered.map(b=>'<div class="book" data-action="openBook" data-id="'+safe(b.id)+'"><div class="cover">✦</div><div class="bookinfo"><h3 class="booktitle">'+safe(b.title)+'</h3><div class="meta">'+b.chapters.length+' bölüm · Son kayıt '+date(b.updatedAt)+'</div><div class="desc">'+safe(b.description||'Bölümleri aç ve okumaya devam et')+'</div></div><span class="arrow">›</span></div>').join('');
return header('Kitaplığım','Sohbetlerden kopyaladığın metinler, kendi kitaplığında.')+'<main class="main"><div class="statrow"><div class="stat"><b>'+bc+'</b><small>Kayıtlı kitap</small></div><div class="stat"><b>'+cc+'</b><small>Toplam bölüm</small></div></div><div class="sectionrow"><h2>Kitaplarım</h2><button class="smallbtn" data-action="newBook">+ Yeni kitap</button></div>'+(bc?'<input id="search" class="search" placeholder="Kitap veya metin ara…" value="'+safe(searchText)+'" autocomplete="off">':'')+(bc?cards:empty('✧','İlk kitabını oluştur','Kitabına isim ver. Bölüm başlığını yaz ve sohbetlerimizdeki metni kopyalayıp yapıştır.','Kitap oluştur','newBook'))+(bc&&!filtered.length?'<div class="infobox">Aramana uygun kitap ya da bölüm bulunamadı.</div>':'')+'<div class="sectionrow" style="margin-top:26px"><h2>Arşiv ve yedekleme</h2><button class="smallbtn" data-action="backup">Yedekle ›</button></div><div class="infobox">Kitaplar internetsiz çalışır ve kayıtlar bu cihazda saklanır. Telefon değiştirirken veya uygulamayı silmeden önce yedek al.</div>'+foot()+'</main>';
}
function bookPage(){const b=book();if(!b){view.page='home';return home()}
const last=b.chapters.find(c=>c.id===b.lastReadChapterId);
const resume=last?'<div class="resume"><div><b>Kaldığın yerden devam et</b><small>'+safe(last.title)+' · Sayfa '+(Math.max(1,Number(last.lastPage)||1))+'</small></div><button class="primary" data-action="continueReading">Oku ›</button></div>':'';
return header(b.title,b.chapters.length+' bölüm · Son düzenleme '+date(b.updatedAt),true)+'<main class="main">'+resume+'<div class="actions"><button class="primary" data-action="newChapter">+ Yeni bölüm</button><button class="secondary" data-action="editBook">Kitap bilgisi</button></div><div class="sectionrow"><h2>Bölümler</h2><span class="eyebrow">SIRALI İÇİNDEKİLER</span></div>'+(!b.chapters.length?empty('§','Henüz bölüm yok','Sohbetimizdeki bölümün tamamını kopyala. Yeni bölüm ekle ve metni yapıştır.','İlk bölümü ekle','newChapter'):
 b.chapters.map((c,i)=>'<div class="chapter"><div class="chno">'+String(i+1).padStart(2,'0')+'</div><div class="chinfo" data-action="readChapter" data-id="'+safe(c.id)+'"><b>'+safe(c.title||('Bölüm '+(i+1)))+'</b><small>'+words(c.body)+' kelime · '+(c.lastPage&&c.lastPage>1?'Kaldığın sayfa '+c.lastPage+' · ':'')+date(c.updatedAt)+'</small></div><div class="chactions"><button class="iconbtn" data-action="editChapter" data-id="'+safe(c.id)+'" title="Düzenle">✎</button><button class="iconbtn" data-action="chapterMenu" data-id="'+safe(c.id)+'" title="Diğer">⋮</button></div></div>').join(''))+'<div class="sectionrow"><h2>Kitap işlemleri</h2></div><div class="actions"><button class="secondary" data-action="exportBookTxt">Kitabı .txt kaydet</button><button class="secondary" data-action="backup">Yedekle</button><button class="secondary danger" data-action="deleteBook">Kitabı sil</button></div>'+foot()+'</main>'}
function editor(){const b=book(),c=chap();if(!b||!c){view.page='home';return home()}return header('Bölümü düzenle',b.title,true)+'<main class="main"><div class="infobox">ChatGPT sohbetindeki metne basılı tutup kopyala; buradaki alana basılı tutarak yapıştır. Otomatik kaydedilir.</div><label class="fieldlabel" for="chapter-title">BÖLÜM BAŞLIĞI</label><input id="chapter-title" class="field fieldtitle" placeholder="Örnek: Birinci Bölüm — Hakikat" value="'+safe(c.title)+'" autocomplete="off"><div class="inlinehead"><label class="fieldlabel" for="chapter-body">BÖLÜM METNİ</label><span id="saved-status" class="edithelp">Kaydedildi</span></div><textarea id="chapter-body" class="bodyarea" spellcheck="true" placeholder="Buraya bölüm metnini yapıştır…">'+safe(c.body)+'</textarea><div class="edithelp" id="word-count">'+words(c.body)+' kelime · Her değişiklik otomatik kaydedilir</div><div class="sectionrow"><h2>İşlemler</h2></div><div class="actions"><button class="secondary" data-action="readFromEditor">Okuma görünümü</button><button class="secondary danger" data-action="deleteChapter">Bölümü sil</button></div></main><div class="fixedbar"><div class="fixedinner"><button class="secondary" data-action="back">‹ Bölümlere dön</button><button class="primary" data-action="saveEditor">Kaydet</button></div></div>'}
function formatted(s){let txt=safe(s||'');txt=txt.replace(/^### (.+)$/gm,'<h4>$1</h4>').replace(/^## (.+)$/gm,'<h3>$1</h3>').replace(/^# (.+)$/gm,'<h3>$1</h3>');txt=txt.replace(/\*\*([^\n*]+)\*\*/g,'<strong>$1</strong>');return txt}
function reader(){const b=book(),c=chap();if(!b||!c){view.page='home';return home()}
 const ix=b.chapters.indexOf(c),fs=Math.max(14,Math.min(27,db.fontSize||18));
 return '<div class="reading-shell"><div class="readtop"><button aria-label="Bölümlere dön" data-action="back">‹</button><div class="readinfo"><b>'+safe(b.title)+'</b><span>'+safe(c.title)+' · '+(ix+1)+'. Bölüm</span></div><button aria-label="Bölümü düzenle" data-action="editFromReader">✎</button></div><div class="readarea"><article class="page-frame"><div class="page-imprint">İ L M İ Z A N</div><div class="page-rule"></div><div id="page-window" class="page-window"><div id="page-columns" class="page-columns" style="font-size:'+fs+'px"><h2 class="chapter-page-title">'+safe(c.title||('Bölüm '+(ix+1)))+'</h2><div class="prose">'+(c.body?formatted(c.body):'<span style="color:#99a69b">Bu bölüm henüz boş.</span>')+'</div></div></div><div class="page-folio" id="page-folio">— 1 —</div></article></div><nav class="page-tools" aria-label="Sayfalar"><button data-action="smallerFont" aria-label="Yazıyı küçült">A−</button><button class="page-arrow" id="prev-page" data-action="prevPage" aria-label="Önceki sayfa">‹</button><button class="page-counter" id="page-counter" data-action="pageJump" aria-label="Sayfaya git">Sayfa 1 / 1</button><button class="page-arrow" id="next-page" data-action="nextPage" aria-label="Sonraki sayfa">›</button><button data-action="biggerFont" aria-label="Yazıyı büyüt">A+</button></nav><nav class="chapter-nav"><button data-action="prevChapter" '+(ix===0?'disabled':'')+'>‹ Önceki bölüm</button><button data-action="nextChapter" '+(ix===b.chapters.length-1?'disabled':'')+'>Sonraki bölüm ›</button></nav></div>'}
function updatePageUi(){const width=pagination.width||1;const cols=$('page-columns');if(!cols)return;
 cols.style.transform='translateX(-'+((pagination.page-1)*width)+'px)';
 const counter=$('page-counter');if(counter)counter.textContent='Sayfa '+pagination.page+' / '+pagination.count;
 const folio=$('page-folio');if(folio)folio.textContent='— '+pagination.page+' —';
 const prev=$('prev-page'),next=$('next-page');if(prev)prev.disabled=pagination.page<=1;if(next)next.disabled=pagination.page>=pagination.count;
}
function layoutPages(){if(view.page!=='reader')return;const win=$('page-window'),cols=$('page-columns'),c=chap(),b=book();if(!win||!cols||!c||!b)return;
 const width=Math.max(1,Math.floor(win.getBoundingClientRect().width)),height=Math.max(1,Math.floor(win.getBoundingClientRect().height));
 cols.style.transform='none';cols.style.width=width+'px';cols.style.height=height+'px';cols.style.columnWidth=width+'px';cols.style.columnGap='0px';
 void cols.offsetHeight;
 const total=Math.max(1,Math.ceil((cols.scrollWidth-0.5)/width));pagination.width=width;pagination.count=total;
 pagination.page=Math.max(1,Math.min(total,Math.floor(Number(c.lastPage)||1)));
 if(b.lastReadChapterId!==c.id){b.lastReadChapterId=c.id;persist()}
 if(Number(c.lastPage)!==pagination.page){c.lastPage=pagination.page;persist()}
 updatePageUi();
}
function setPage(newPage){if(view.page!=='reader')return;const c=chap(),b=book();if(!c||!b)return;
 const n=Math.max(1,Math.min(pagination.count,Math.round(newPage)));if(n===pagination.page)return;
 pagination.page=n;c.lastPage=n;b.lastReadChapterId=c.id;persist();updatePageUi();
}
function turnPage(delta){setPage(pagination.page+delta)}
function jumpPage(){showModal({title:'Sayfaya git',desc:'Bu bölüm '+pagination.count+' sayfa. Gitmek istediğin sayfa numarasını yaz.',fields:[{label:'SAYFA NUMARASI',value:String(pagination.page)}],ok:'Sayfayı aç',onOk:v=>{const n=Number(v[0]);if(!Number.isInteger(n)||n<1||n>pagination.count){toast('1 ile '+pagination.count+' arasında sayfa yaz.');return}setPage(n)}})}

function backup(){const total=db.books.reduce((n,b)=>n+b.chapters.length,0);return header('Yedekleme','Eserlerini ve yazılarını kaybetmemek için.',true)+'<main class="main"><div class="infobox">Yedek, bütün kitapları, bölüm başlıklarını ve tüm metinlerini içerir. İndirilen .json dosyasını güvenli bir yerde sakla.</div><section class="backbox"><h3>Yedek oluştur</h3><p>'+db.books.length+' kitap, '+total+' bölüm. Bütün arşivi tek bir metin olarak kopyalayabilirsin.</p><button class="primary" data-action="downloadBackup">Yedek dosyasını indir</button><button class="secondary" style="width:100%;margin-top:9px" data-action="showExport">Yedeği metin olarak göster</button><textarea id="exportbox" class="field backuptext hidden" readonly></textarea><button id="copybtn" class="secondary hidden" style="margin-top:9px;width:100%" data-action="copyExport">Metni kopyala</button></section><section class="backbox"><h3>Yedekten geri yükle</h3><p>Daha önce indirdiğin yedek dosyasını seç veya yedek metnini yapıştır. Bu işlem mevcut kitaplarının yerine yedek arşivini getirir.</p><label class="fieldlabel" for="backup-file">YEDEK DOSYASI SEÇ (.JSON)</label><input id="backup-file" class="field" type="file" accept=".json,application/json,text/plain" style="margin-bottom:9px"/><label class="fieldlabel" for="importbox">VEYA YEDEK METNİNİ YAPIŞTIR</label><textarea id="importbox" class="field backuptext" placeholder="Yedek metnini buraya yapıştır..."></textarea><button class="secondary" style="margin-top:9px;width:100%" data-action="importBackup">Yedeği geri yükle</button></section><section class="backbox"><h3>Önemli bilgi</h3><p>Uygulama internete bağlanmaz. Telefon sıfırlanırsa, uygulamanın verileri temizlenirse veya uygulama kaldırılırsa yerel kayıtlar silinebilir. Düzenli yedek al.</p></section>'+foot()+'</main>'}
function render(){let html=view.page==='home'?home():view.page==='book'?bookPage():view.page==='editor'?editor():view.page==='reader'?reader():backup();$('app').innerHTML=view.page==='reader'?html:'<div class="shell">'+html+'</div>';if(view.page==='reader')requestAnimationFrame(layoutPages);}
function goto(page,bookId,chapterId){flush();view.page=page;if(bookId!==undefined)view.bookId=bookId;if(chapterId!==undefined)view.chapterId=chapterId;try{history.pushState({kitapligim:1,view:{...view}},'')}catch(e){}render();window.scrollTo(0,0)}
function back(){flush();if(view.page==='home'){toast('Kitaplığındasın');return}if(view.page==='editor'||view.page==='reader')goto('book');else goto('home')}
function showModal({title,desc='',fields=[],ok='Kaydet',danger=false,onOk}){const root=$('modal-root');root.innerHTML='<div class="modalOverlay"><div class="modal"><h3>'+safe(title)+'</h3><p>'+safe(desc)+'</p>'+fields.map((f,i)=>'<label class="fieldlabel" for="modal-'+i+'">'+safe(f.label)+'</label><input class="field" id="modal-'+i+'" value="'+safe(f.value||'')+'" placeholder="'+safe(f.placeholder||'')+'" maxlength="180"/>').join('')+'<div class="modalactions"><button class="secondary" id="modalCancel">Vazgeç</button><button class="'+(danger?'secondary danger':'primary')+'" id="modalOk">'+safe(ok)+'</button></div></div></div>';root.querySelector('#modalCancel').onclick=closeModal;root.querySelector('#modalOk').onclick=()=>{let vals=fields.map((f,i)=>root.querySelector('#modal-'+i).value.trim());if(fields.length&&!vals[0]){toast('Lütfen isim veya başlık yaz.');return}onOk(vals);closeModal()};const first=root.querySelector('input');if(first)setTimeout(()=>first.focus(),120)}
function closeModal(){$('modal-root').innerHTML=''}
function makeBook(){showModal({title:'Yeni kitap',desc:'Kitabının ismini yaz. Bölümleri daha sonra tek tek ekleyebilirsin.',fields:[{label:'KİTAP ADI',placeholder:'Kitabın adı'},{label:'ALT AÇIKLAMA (İSTEĞE BAĞLI)',placeholder:'Kitabın kısa açıklaması'}],ok:'Kitap oluştur',onOk:values=>{const b={id:uuid(),title:values[0],description:values[1],createdAt:today(),updatedAt:today(),chapters:[]};db.books.unshift(b);persist();goto('book',b.id)}})}
function makeChapter(){const b=book();if(!b)return;showModal({title:'Yeni bölüm',desc:'Bölüm başlığını yaz. Metnini bir sonraki ekrana yapıştıracaksın.',fields:[{label:'BÖLÜM BAŞLIĞI',placeholder:'Örnek: Birinci Bölüm'}],ok:'Bölümü oluştur',onOk:values=>{const c={id:uuid(),title:values[0],body:'',createdAt:today(),updatedAt:today()};b.chapters.push(c);b.updatedAt=today();persist();goto('editor',b.id,c.id)}})}
function editBook(){const b=book();if(!b)return;showModal({title:'Kitap bilgisi',desc:'Kitabın ismini ve alt açıklamasını değiştirebilirsin.',fields:[{label:'KİTAP ADI',value:b.title},{label:'ALT AÇIKLAMA',value:b.description}],ok:'Değişiklikleri kaydet',onOk:v=>{b.title=v[0];b.description=v[1];b.updatedAt=today();persist();render()}})}
function saveEditor(explicit){const c=chap(),b=book();if(!c||!b)return;const t=$('chapter-title'),a=$('chapter-body');if(!t||!a)return;c.title=t.value.trim()||'Başlıksız bölüm';c.body=a.value;c.updatedAt=today();b.updatedAt=today();pending=false;let good=persist();const st=$('saved-status');if(st)st.textContent=good?'✓ Kaydedildi':'Kayıt hatası';if(explicit)toast(good?'Bölüm kaydedildi':'Kaydedilemedi')}
function queueSave(){pending=true;const st=$('saved-status');if(st)st.textContent='Kaydediliyor…';const w=$('word-count'),a=$('chapter-body');if(w&&a)w.textContent=words(a.value)+' kelime · Otomatik kayıt açık';clearTimeout(editTimer);editTimer=setTimeout(()=>{editTimer=null;saveEditor(false)},250)}
function askDeleteChapter(){const c=chap(),b=book();if(!b||!c)return;showModal({title:'Bölümü sil?',desc:'“'+c.title+'” bölümü ve tüm metni silinecek. Bu işlem geri alınamaz.',ok:'Evet, sil',danger:true,onOk:()=>{b.chapters=b.chapters.filter(x=>x.id!==c.id);b.updatedAt=today();persist();goto('book')}})}
function askDeleteBook(){const b=book();if(!b)return;showModal({title:'Kitabı sil?',desc:'“'+b.title+'” kitabı ve '+b.chapters.length+' bölümü tümüyle silinecek. Önce yedek alman önerilir.',ok:'Kitabı sil',danger:true,onOk:()=>{db.books=db.books.filter(x=>x.id!==b.id);persist();goto('home')}})}
function menuChapter(id){const b=book(),c=b&&b.chapters.find(x=>x.id===id);if(!b||!c)return;const idx=b.chapters.indexOf(c);showModal({title:'Bölüm işlemleri',desc:c.title,fields:[],ok:'Kapat',onOk:()=>{}});const root=$('modal-root'),holder=root.querySelector('.modal');const a=document.createElement('div');a.className='actions';a.style.marginTop='10px';a.innerHTML='<button class="secondary" data-action="moveUp" data-id="'+safe(id)+'" '+(idx===0?'disabled':'')+'>↑ Yukarı</button><button class="secondary" data-action="moveDown" data-id="'+safe(id)+'" '+(idx===b.chapters.length-1?'disabled':'')+'>↓ Aşağı</button><button class="secondary danger" data-action="deleteChapterById" data-id="'+safe(id)+'">Sil</button>';holder.insertBefore(a,holder.querySelector('.modalactions'))}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Yedek panoya kopyalandı'),()=>fallbackCopy(t))}else fallbackCopy(t)}
function fallbackCopy(t){const el=$('exportbox');if(!el)return;el.classList.remove('hidden');el.focus();el.select();el.setSelectionRange(0,el.value.length);try{if(document.execCommand('copy'))toast('Yedek panoya kopyalandı');else toast('Metni seçip Kopyala seçeneğini kullan.')}catch(e){toast('Metni seçip Kopyala seçeneğini kullan.')}}
function backupObject(){return {format:'ilmizan_kitapligim',version:1,exportedAt:today(),books:db.books,fontSize:db.fontSize}}
function filename(s){return String(s||'kitap').replace(/[^a-zA-Z0-9\u00C0-\u024F\u1E00-\u1EFF_-]+/g,'_').slice(0,75)||'kitap'}
function saveAs(name,mime,content){
 try{if(window.ILMIZAN&&typeof window.ILMIZAN.saveDocument==='function'){
   window.ILMIZAN.saveDocument(name,mime,content);return;
 }}catch(e){toast('Dosya kaydedilemedi: '+e.message);return}
 try{const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);
   const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),20000);toast('İndirme başlatıldı. İndirilenler klasörüne bak.');
 }catch(e){toast('İndirme desteklenmiyor. Yedeği metin olarak kopyala.')}
}
function toPlainText(b){return b.title+'\n'+(b.description||'')+'\n\n'+b.chapters.map((c,i)=>'BÖLÜM '+(i+1)+' — '+c.title+'\n\n'+c.body+'\n\n').join('')}
function importObject(obj){
 if(!isValidBackup(obj)){toast('Dosya geçerli bir İLMİZAN yedeği değil.');return}
 showModal({title:'Yedeği geri yükle?',desc:'Mevcut kitapların yerine bu yedekteki '+obj.books.length+' kitap gelecek. Devam etmeden mevcut arşivini yedekle.',ok:'Geri yükle',danger:true,onOk:()=>{const prior=db;db={books:obj.books,fontSize:obj.fontSize||18};if(!persist()){db=prior;return}goto('home');toast('Yedek geri yüklendi')}})
}
function isValidBackup(obj){return obj&&Array.isArray(obj.books)&&obj.books.every(b=>typeof b.title==='string'&&Array.isArray(b.chapters)&&b.chapters.every(c=>typeof c.title==='string'&&typeof c.body==='string'))}
function action(type,id){const b=book();switch(type){case'back':back();break;case'backup':goto('backup');break;case'newBook':makeBook();break;case'openBook':goto('book',id);break;case'continueReading':if(b&&b.lastReadChapterId&&b.chapters.some(c=>c.id===b.lastReadChapterId))goto('reader',b.id,b.lastReadChapterId);break;case'newChapter':makeChapter();break;case'editBook':editBook();break;case'readChapter':goto('reader',view.bookId,id);break;case'editChapter':goto('editor',view.bookId,id);break;case'readFromEditor':flush();goto('reader');break;case'editFromReader':goto('editor');break;case'saveEditor':saveEditor(true);break;case'deleteChapter':askDeleteChapter();break;case'deleteChapterById':closeModal();view.chapterId=id;askDeleteChapter();break;case'deleteBook':askDeleteBook();break;case'chapterMenu':menuChapter(id);break;case'moveUp':case'moveDown':if(!b)return;let i=b.chapters.findIndex(c=>c.id===id),j=i+(type==='moveUp'?-1:1);if(i>=0&&j>=0&&j<b.chapters.length){[b.chapters[i],b.chapters[j]]=[b.chapters[j],b.chapters[i]];b.updatedAt=today();persist()}closeModal();render();break;case'exportBookTxt':if(b){saveAs(filename(b.title)+'.txt','text/plain;charset=utf-8',toPlainText(b))}break;case'downloadBackup':saveAs('ILMIZAN_yedek_'+new Date().toISOString().slice(0,10)+'.json','application/json;charset=utf-8',JSON.stringify(backupObject(),null,2));break;case'prevPage':turnPage(-1);break;case'nextPage':turnPage(1);break;case'pageJump':jumpPage();break;case'prevChapter':if(b){const i=b.chapters.findIndex(c=>c.id===view.chapterId);if(i>0)goto('reader',view.bookId,b.chapters[i-1].id)}break;case'nextChapter':if(b){const i=b.chapters.findIndex(c=>c.id===view.chapterId);if(i>=0&&b.chapters[i+1])goto('reader',view.bookId,b.chapters[i+1].id)}break;case'smallerFont':db.fontSize=Math.max(14,(db.fontSize||18)-1);persist();render();break;case'biggerFont':db.fontSize=Math.min(27,(db.fontSize||18)+1);persist();render();break;case'showExport':{const e=$('exportbox');if(!e)return;e.value=JSON.stringify(backupObject(),null,2);e.classList.remove('hidden');$('copybtn').classList.remove('hidden');toast('Yedek hazır. Kopyalayıp güvenli bir yere kaydet.');break}case'copyExport':{const el=$('exportbox');if(el)copyText(el.value);break}case'importBackup':{const el=$('importbox');if(!el||!el.value.trim()){toast('Önce yedek metnini yapıştır.');return}let obj;try{obj=JSON.parse(el.value)}catch(e){toast('Yedek metni geçerli JSON değil.');return}if(!isValidBackup(obj)){toast('Bu metin Kitaplığım yedeği değil.');return}importObject(obj);break}default:break}}
document.addEventListener('click',ev=>{const bt=ev.target.closest('[data-action]');if(!bt)return;ev.preventDefault();action(bt.dataset.action,bt.dataset.id)});
document.addEventListener('input',ev=>{const id=ev.target.id;if(id==='chapter-body'||id==='chapter-title')queueSave();else if(id==='search'){searchText=ev.target.value;const pos=ev.target.selectionStart;render();const q=$('search');if(q){q.focus();q.setSelectionRange(pos,pos)}}});
document.addEventListener('change',ev=>{if(ev.target.id==='backup-file'){
 const file=ev.target.files&&ev.target.files[0];if(!file)return;
 if(file.size>40*1024*1024){toast('Yedek çok büyük (40 MB sınırı).');return}
 const reader=new FileReader();reader.onload=()=>{try{const raw=String(reader.result);const obj=JSON.parse(raw);const box=$('importbox');if(box)box.value=raw;toast('Dosya okundu. Geri yükleye bas.') }catch(e){toast('Yedek dosyası okunamadı.')}};
 reader.onerror=()=>toast('Dosya açılamadı.');reader.readAsText(file,'UTF-8');
}});
document.addEventListener('touchstart',ev=>{if(view.page!=='reader'||!ev.target.closest('#page-window')||ev.touches.length!==1)return;const t=ev.touches[0];gestureStart={x:t.clientX,y:t.clientY,time:Date.now()};},{passive:true});
document.addEventListener('touchend',ev=>{if(!gestureStart||view.page!=='reader')return;const origin=gestureStart;gestureStart=null;const t=ev.changedTouches[0],dx=t.clientX-origin.x,dy=t.clientY-origin.y;
 if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.3){turnPage(dx<0?1:-1);return}
 if(Math.abs(dx)<13&&Math.abs(dy)<13&&Date.now()-origin.time<320&&!String(window.getSelection()||'')){
  const rect=$('page-window')?.getBoundingClientRect();if(!rect)return;const ratio=(t.clientX-rect.left)/rect.width;
  if(ratio<.25)turnPage(-1);else if(ratio>.75)turnPage(1);
 }
},{passive:true});
window.addEventListener('resize',()=>{if(view.page!=='reader')return;clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(view.page==='reader')layoutPages()},130)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});window.addEventListener('pagehide',flush);
window.addEventListener('popstate',ev=>{flush();view=ev.state&&ev.state.kitapligim?{...ev.state.view}:{page:'home',bookId:null,chapterId:null};render();window.scrollTo(0,0)});
window.ilmizanBack=back;window.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('modal-root').innerHTML){back()}else if(ev.key==='Escape'){closeModal()}});
render();
})();
</script></body></html>
