name: Build ILMIZAN Kitapligim APK
on:
  push:
    branches:
      - ilmizan-apk-build
    paths:
      - 'ilmizan/**'
      - '.github/workflows/ilmizan-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up stable debug signing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 -d .bootstrap/hinkurdi-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "Project signing key:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep 'SHA256:'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile signed APK
        run: gradle -p ilmizan --no-daemon :app:assembleDebug
      - name: Verify APK and old-install signature
        shell: bash
        run: |
          SDK_APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          OUTPUT=ilmizan/app/build/outputs/apk/debug/app-debug.apk
          "$SDK_APKSIGNER" verify --verbose --print-certs "$OUTPUT"
          unzip -t "$OUTPUT"
          ACTUAL=$("$SDK_APKSIGNER" verify --print-certs "$OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          EXPECTED=b657863cc383596f13dce41fcfa27eb9b1661c5a467b75af923da692577a2d56
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signer differs from preserved stable key; stop build."
            exit 1
          fi
      - name: Upload compatible APK
        uses: actions/upload-artifact@v4
        with:
          name: ILMIZAN-Kitapligim-v1.3.2-YeniKurulum-APK
          path: ilmizan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
