name: Build ILMIZAN Kitapligim APK
on:
  push:
    branches:
      - ilmizan-apk-build
    paths:
      - 'ilmizan/**'
      - '.github/workflows/ilmizan-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up stable debug signing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 -d .bootstrap/hinkurdi-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile signed APK
        run: gradle -p ilmizan --no-daemon :app:assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          SDK_APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SDK_APKSIGNER" verify --verbose --print-certs ilmizan/app/build/outputs/apk/debug/app-debug.apk
          unzip -t ilmizan/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ILMIZAN-Kitapligim-v1.2.0-APK
          path: ilmizan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
