name: Build HînKurdî APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore full Android source
        shell: bash
        run: |
          cat .bootstrap/project.part*.b64 > /tmp/HinKurdi.b64
          base64 -d /tmp/HinKurdi.b64 > /tmp/HinKurdi.zip
          echo "e98d354428f17dbfd06587387780f2d13efa0f729150c16d6e00802d9710e479  /tmp/HinKurdi.zip" | sha256sum -c -
          unzip -o /tmp/HinKurdi.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HinKurdi-V20-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
