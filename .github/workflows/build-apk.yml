name: Build HînKurdî APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android shell and inject V24
        shell: bash
        run: |
          cat .bootstrap/project.part*.b64 > /tmp/HinKurdi.b64
          base64 -d /tmp/HinKurdi.b64 > /tmp/HinKurdi.zip
          echo "e98d354428f17dbfd06587387780f2d13efa0f729150c16d6e00802d9710e479  /tmp/HinKurdi.zip" | sha256sum -c -
          unzip -o /tmp/HinKurdi.zip -d .

          cat .bootstrap/v24.part*.b64 > /tmp/v24-index.html.gz.b64
          base64 -d /tmp/v24-index.html.gz.b64 | gzip -d > app/src/main/assets/index.html
          echo "9798ffe0a3f5eb89e75091f9870ad5185ac8907398a30832545af2d189072be3  app/src/main/assets/index.html" | sha256sum -c -

          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts
          sed -i 's/versionCode = 20/versionCode = 24/' app/build.gradle.kts
          sed -i 's/versionName = "0.20.0-rc2"/versionName = "0.24.0-foundation-01"/' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build V24 debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload V24 APK
        uses: actions/upload-artifact@v4
        with:
          name: HinKurdi-V24-Foundation-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
