name: Build KlonMatik V3 APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build-klonmatik-v2.yml'
      - 'KlonMatik/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066" "cmake;3.22.1"

      - name: Fetch pinned virtualization engine
        shell: bash
        run: |
          rm -rf .ci_klonmatik
          git clone --filter=blob:none https://github.com/Black00Z/Blacks-BlackBox.git .ci_klonmatik
          cd .ci_klonmatik
          git checkout 40282a7bf4500948cfd598fc67e6e63114b26dd9

      - name: Apply KlonMatik branding and unique package
        shell: bash
        run: |
          cd .ci_klonmatik

          python3 - <<'PY'
          from pathlib import Path

          # Give this build its own package id so it cannot collide with any
          # existing BlackBox/NewBlackBox installation on the phone.
          g = Path("app/build.gradle")
          s = g.read_text(encoding="utf-8")
          s = s.replace('applicationId "com.onebitmonochrome.blacksbbox"',
                        'applicationId "com.naturel.klonmatik"')
          s = s.replace("versionCode = 460", "versionCode = 471")
          s = s.replace('versionName = "4.7.1"', 'versionName = "3.0"')
          g.write_text(s, encoding="utf-8")

          p = Path("app/src/main/res/values/strings.xml")
          s = p.read_text(encoding="utf-8")
          s = s.replace("Black\\'s BlackBox", "KlonMatik")
          s = s.replace("BlackBox", "KlonMatik")
          p.write_text(s, encoding="utf-8")

          menu = Path("app/src/main/res/menu/menu_main.xml")
          menu.write_text("""<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <menu xmlns:android=\"http://schemas.android.com/apk/res/android\"
                xmlns:app=\"http://schemas.android.com/apk/res-auto\">
              <item
                  android:id=\"@+id/main_setting\"
                  android:title=\"@string/setting\"
                  app:showAsAction=\"never\" />
              <item
                  android:id=\"@+id/fake_location\"
                  android:title=\"@string/fake_location\"
                  android:visible=\"false\"
                  app:showAsAction=\"never\" />
              <item
                  android:id=\"@+id/device_spoofing\"
                  android:title=\"@string/device_spoofing\"
                  android:visible=\"false\"
                  app:showAsAction=\"never\" />
              <item
                  android:id=\"@+id/blackbox_gallery\"
                  android:title=\"@string/blackbox_gallery_menu\"
                  android:visible=\"false\"
                  app:showAsAction=\"never\" />
          </menu>
          """, encoding="utf-8")

          tr = Path("app/src/main/res/values-tr")
          tr.mkdir(parents=True, exist_ok=True)
          (tr / "strings.xml").write_text("""<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <resources>
              <string name=\"app_name\">KlonMatik</string>
              <string name=\"choose\">Seç</string>
              <string name=\"choose_app\">Uygulama Seç</string>
              <string name=\"installed_app\">Yüklü Uygulamalar</string>
              <string name=\"empty_empty\">Boş</string>
              <string name=\"filter\">Filtre</string>
              <string name=\"setting\">Ayarlar</string>
              <string name=\"done\">Tamam</string>
              <string name=\"cancel\">İptal</string>
              <string name=\"app_stop\">Çalışmayı Durdur</string>
              <string name=\"app_clear\">Veriyi Temizle</string>
              <string name=\"app_remove\">Klonu Sil</string>
              <string name=\"app_shortcut\">Kısayol Oluştur</string>
              <string name=\"install_success\">Klon başarıyla eklendi</string>
              <string name=\"install_fail\">Klon eklenemedi: %s</string>
              <string name=\"install_fail_no_msg\">Klon eklenemedi</string>
              <string name=\"uninstall_success\">Klon silindi</string>
              <string name=\"uninstall_fail\">Klon silinemedi</string>
              <string name=\"uninstall_app\">Klonu Sil</string>
              <string name=\"remove_success\">Silindi</string>
              <string name=\"clear_success\">Veriler temizlendi</string>
              <string name=\"start_fail\">Uygulama açılamadı</string>
              <string name=\"cannot_create_shortcut\">Bu ana ekran kısayol oluşturmayı desteklemiyor</string>
              <string name=\"other\">Diğer</string>
              <string name=\"dark_mode\">Koyu tema</string>
              <string name=\"dark_mode_summary\">KlonMatik arayüzünde koyu tema kullan</string>
              <string name=\"freeze_app_instantly_title\">Klonu hızlı dondur</string>
              <string name=\"freeze_app_instantly_summary\">Çalışan klon için hızlı durdurma düğmesi ekler.</string>
              <string name=\"enable\">Etkinleştir</string>
              <string name=\"gms_manager\">Google Servisleri</string>
              <string name=\"jump_gms\">Google servisleri yönetimine git</string>
              <string name=\"enable_gms\">Google servislerini etkinleştir</string>
              <string name=\"disable_gms\">Google servislerini kapat</string>
              <string name=\"about_title\">Hakkında</string>
          </resources>
          """, encoding="utf-8")
          PY

      - name: Build APK
        working-directory: .ci_klonmatik
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Select universal APK and verify
        shell: bash
        run: |
          mkdir -p out
          APK="$(find .ci_klonmatik/app/build/outputs/apk/debug -type f -name '*universal*.apk' | head -1)"
          if [ -z "$APK" ]; then
            APK="$(find .ci_klonmatik/app/build/outputs/apk/debug -type f -name '*.apk' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          fi
          test -n "$APK"
          cp "$APK" out/KlonMatik-v3.apk

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$AAPT" dump badging out/KlonMatik-v3.apk | tee out/badging.txt
          grep -q "package: name='com.naturel.klonmatik'" out/badging.txt
          "$APKSIGNER" verify --verbose --print-certs out/KlonMatik-v3.apk | tee out/signature.txt
          "$ZIPALIGN" -c -P 16 -v 4 out/KlonMatik-v3.apk > out/zipalign.txt
          sha256sum out/KlonMatik-v3.apk | tee out/KlonMatik-v3.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KlonMatik-v3-apk
          path: |
            out/KlonMatik-v3.apk
            out/KlonMatik-v3.sha256
            out/badging.txt
            out/signature.txt
            out/zipalign.txt
          if-no-files-found: error
