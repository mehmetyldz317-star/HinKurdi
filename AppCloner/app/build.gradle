plugins {
    id 'com.android.application'
}

android {
    namespace 'com.naturel.ayrialan'
    compileSdk 35

    defaultConfig {
        applicationId "com.naturel.ayrialan"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
